# Plantilla: copie a 01-secrets.yaml (ignorado por git), reemplace los valores y aplique con oc apply -f.
# La contrasena de PostgreSQL debe coincidir con la de DATABASE_URL.
apiVersion: v1
kind: Secret
metadata:
  name: portales-formularios-postgresql-secret
type: Opaque
stringData:
  username: formularios
  password: "CAMBIAR_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: portales-formularios-backend-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql://formularios:CAMBIAR_PASSWORD@portales-formularios-postgresql:5432/formularios"
  JWT_SECRET: "CAMBIAR_POR_32_O_MAS_CARACTERES_ALEATORIOS"
  ADMIN_NAME: "Administrador"
  ADMIN_EMAIL: "admin@ejemplo.gob.gt"
  ADMIN_PASSWORD: "CAMBIAR_PASSWORD"
