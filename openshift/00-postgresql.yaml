apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portal-formularios-postgresql-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: thin  # Cambiar por el StorageClass disponible en el cluster
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-formularios-postgresql
  labels:
    app: portal-formularios-postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal-formularios-postgresql
  strategy:
    type: Recreate  # Necesario para volumenes ReadWriteOnce
  template:
    metadata:
      labels:
        app: portal-formularios-postgresql
    spec:
      imagePullSecrets:
        - name: srv-osnexus01.minfin.gob.gt
      containers:
        - name: postgresql
          # No "postgres:16-alpine" directo: los nodos de este cluster no tienen salida a Docker Hub
          # (por eso el resto de imágenes también se publican en OSNexus). Hay que espejar esta imagen
          # ahí primero — ver instrucciones en el README.
          image: srv-osnexus01.minfin.gob.gt:8006/postgres-16-alpine-img:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: formularios
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: portal-formularios-postgresql-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portal-formularios-postgresql-secret
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      # No fijar securityContext.runAsUser/fsGroup: OpenShift asigna un UID
      # arbitrario segun la SCC restricted del proyecto.
      volumes:
        - name: postgresql-data
          persistentVolumeClaim:
            claimName: portal-formularios-postgresql-data
---
apiVersion: v1
kind: Service
metadata:
  name: portal-formularios-postgresql
spec:
  selector:
    app: portal-formularios-postgresql
  ports:
    - port: 5432
      targetPort: 5432
