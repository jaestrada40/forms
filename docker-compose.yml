services:
  postgres:
    image: postgres:16-alpine
    container_name: formularios-postgres
    environment:
      POSTGRES_DB: formularios
      POSTGRES_USER: formularios
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env.local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formularios -d formularios"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
